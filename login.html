<!DOCTYPE html>
<html>
<head>
  <title>Log In - 7 Wonders</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <a href="Index.html" class="nav-logo">7 Wonders</a>
        <a href="Index.html" class="nav-link">Home</a>
      </div>
      <div class="nav-right">
        <a href="signin.html" class="signup-btn">Sign Up</a>
        <a href="Index.html#main-content" class="get-started-btn">Get Started</a>
      </div>
    </div>
  </nav>
  
  <section class="signin-section">
    <div class="signin-container">
      <div class="signin-form">
        <h2>Log In to 7 Wonders</h2>
        <form>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit" class="signin-btn">Log In</button>
        </form>
        <p class="signup-text">Don't have an account? <a href="signin.html" class="signup-link">Sign up here</a></p>
      </div>
    </div>
  </section>
</body>
</html>
